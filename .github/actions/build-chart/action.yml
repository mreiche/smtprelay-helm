name: Build Helm chart
description: Lints, packages, and publishes the Helm chart to GHCR
inputs:
  user:
    required: true
    description: User for publishing the chart
  password:
    required: true
    description: Password for publishing the chart

runs:
  using: composite
  steps:
    - name: Set up Helm
      uses: azure/setup-helm@v4

    - name: Lint chart
      run: helm lint ./helm
      shell: bash
