name: Test Helm chart
description: Lints and tests the Helm chart
runs:
  using: composite
  steps:
    - name: Set up Helm
      uses: azure/setup-helm@v5

    - name: Lint chart
      run: helm lint ./helm
      shell: bash

    - name: Install helm-unittest plugin
      run: helm plugin install --verify=false https://github.com/helm-unittest/helm-unittest
      shell: bash

    - name: Run unit tests
      run: helm unittest ./helm
      shell: bash
