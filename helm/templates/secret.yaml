{{- if and (not .Values.existingSecret) .Values.remoteUser .Values.remotePass }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smtprelay.fullname" . }}
  labels:
    {{- include "smtprelay.labels" . | nindent 4 }}
type: Opaque
stringData:
{{ if .Values.remoteUser }}
  REMOTE_USER: {{ .Values.remoteUser | quote }}
{{ end }}{{ if .Values.remotePass }}
  REMOTE_PASS: {{ .Values.remotePass | quote }}
{{ end }}
{{- end }}
