{{ if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smtprelay.fullname" . }}
  labels:
    {{- include "smtprelay.labels" . | nindent 4 }}
stringData:
  REMOTE_USER: {{ .Values.secret.remoteUser | quote }}
  REMOTE_PASS: {{ .Values.secret.remotePassword | quote }}
{{ end }}
