apiVersion: v1
kind: Service
metadata:
  name: {{ include "smtprelay.fullname" . }}
  labels:
    {{- include "smtprelay.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: smtp
      port: {{ .Values.service.port }}
      targetPort: smtp
      protocol: TCP
  selector:
    {{- include "smtprelay.selectorLabels" . | nindent 4 }}
