apiVersion: v1
kind: Service
metadata:
  name: {{ include "smtprelay.fullname" . }}
  labels:
    {{- include "smtprelay.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: smtp
      port: {{ .Values.service.port }}
      targetPort: smtp
      protocol: TCP
    {{ if .Values.serviceMonitor.enabled }}
    - name: metrics
      port: 8080
      targetPort: 8080
    {{ end }}
  selector:
    {{- include "smtprelay.selectorLabels" . | nindent 4 }}
