apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "smtprelay.fullname" . }}
  labels:
    {{- include "smtprelay.labels" . | nindent 4 }}
data:
  smtprelay.ini: |
    {{ $context := . }}
    {{- range $key, $value := .Values.config }}
    {{- if and $value (ne (toString $value) "") }}
    {{ $key }} = {{ tpl $value $context }}
    {{- end }}
    {{- end }}
