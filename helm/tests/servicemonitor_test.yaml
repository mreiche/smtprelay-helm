suite: ServiceMonitor
templates:
  - templates/servicemonitor.yaml

tests:
  - it: should not render ServiceMonitor by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render ServiceMonitor when enabled
    set:
      serviceMonitor:
        enabled: true
    asserts:
      - isKind:
          of: ServiceMonitor
      - isAPIVersion:
          of: monitoring.coreos.com/v1
